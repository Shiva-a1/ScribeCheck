x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }
    minio: { condition: service_started }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: scribe, POSTGRES_PASSWORD: scribe, POSTGRES_DB: scribe }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U scribe"], interval: 5s, retries: 20 }

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 20

  minio:
    image: bitnamilegacy/minio:latest
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio-secret }
    volumes: [miniodata:/bitnami/minio/data]
    ports: ["9000:9000", "9001:9001"]

  api:
    <<: *app
    ports: ["8000:8000"]

  reader:
    <<: *app
    command: python -m workers.reader

  evidence:
    <<: *app
    command: python -m workers.evidence

  judge-claude:
    <<: *app
    command: python -m workers.judge
    environment: { JUDGE: claude }

  judge-openai:
    <<: *app
    command: python -m workers.judge
    environment: { JUDGE: openai }

  judge-gemini:
    <<: *app
    command: python -m workers.judge
    environment: { JUDGE: gemini }

  aggregator:
    <<: *app
    command: python -m workers.aggregator

  feedback:
    <<: *app
    command: python -m workers.feedback

  airflow:
    profiles: [analytics]
    build: { context: ., dockerfile: Dockerfile.airflow }
    command: airflow standalone
    environment:
      DATABASE_URL: postgresql://scribe:scribe@postgres:5432/scribe
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes: [./pipelines:/opt/airflow/dags]
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  nginx:
    profiles: [prod]
    image: nginx:1.27
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports: ["80:80", "443:443"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
